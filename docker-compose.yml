services:
  post-api:
    build:
      context: .
      dockerfile: ./Backend/Post/WebAPI/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=shop-images
      - ConnectionStrings__DefaultConnection=Host=post-db;Port=5432;Database=PostDb;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      post-db:
        condition: service_healthy
      minio:
        condition: service_started

  post-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: PostDb
    ports:
      - "5433:5432"
    volumes:
      - post_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PostDb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  user-api:
    build:
      context: .
      dockerfile: ./Backend/User/WebAPI/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=user-db;Port=5432;Database=UserDb;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      user-db:
        condition: service_healthy

  user-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: UserDb
    ports:
      - "5434:5432"
    volumes:
      - user_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UserDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  follow-api:
    build:
      context: .
      dockerfile: ./Backend/Follow/WebAPI/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=follow-db;Port=5432;Database=FollowDb;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      follow-db:
        condition: service_healthy

  follow-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: FollowDb
    ports:
      - "5435:5432"
    volumes:
      - follow_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FollowDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  
  postgres:
    image: postgres:18-alpine
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: KeycloakDb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d KeycloakDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak_server
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/KeycloakDb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  user_db_data:
  post_db_data:
  follow_db_data:
  minio_data:  
  postgres_data: